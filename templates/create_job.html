{% extends './base.html' %}
{% load static %}

{% block title %}
  <title>CarrerZ: Create Job</title>
{% endblock %}

{% block main %}
  <main class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    <header class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold">Create Job</h1>
      <p class="text-gray-500 mt-1">Fill in the details to post a new job.</p>
    </header>

    <form id="jobForm" class="space-y-6 bg-white p-6 rounded-2xl shadow">
      
      <!-- Title -->
      <section>
        <label class="block text-sm font-medium mb-1">Job Title</label>
        <input type="text" name="title" maxlength="80" required
          class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-200 outline-none" />
      </section>

      <!-- Job Type -->
      <section>
        <label class="block text-sm font-medium mb-1">Job Type</label>
        <select name="job_type" required
          class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-200 outline-none">
          <option value="">Select type</option>
          <option value="FULL">Full-time</option>
          <option value="PART">Part-time</option>
          <option value="INTR">Internship</option>
          <option value="FRLN">Freelance</option>
          <option value="CONT">Contractual</option>
        </select>
      </section>

      <!-- Markdown Editor -->
      <section>
        <label class="block text-sm font-medium mb-2">Job Description (Markdown)</label>

        <!-- Toolbar -->
        <div class="flex flex-wrap gap-2 mb-2">
          <button id="wrap-bold-btn" type="button" class="px-2 py-1 border rounded">Bold</button>
          <button id="wrap-italic-btn" type="button" class="px-2 py-1 border rounded">Italic</button>
          <button id="insert-list-btn" type="button" class="px-2 py-1 border rounded">List</button>
          <button id="insert-h1-btn" type="button" class="px-2 py-1 border rounded">H1</button>
          <button id="insert-h2-btn" type="button" class="px-2 py-1 border rounded">H2</button>
          <button id="insert-h3-btn" type="button" class="px-2 py-1 border rounded">H3</button>
          <button id="insert-link-btn" type="button" class="px-2 py-1 border rounded">Link</button>
        </div>

        <!-- Editor -->
        <textarea id="markdown-input" name="description" rows="6" required
          class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-200 outline-none resize-none"
          placeholder="Write markdown here..."></textarea>

        <!-- Preview -->
        <div class="mt-3">
          <p class="text-sm font-medium mb-1">Preview</p>
          <div id="markdown-preview" class="prose max-w-none border p-6 rounded-lg bg-gray-50"></div>
        </div>
      </section>

      <!-- Locations Multi Select -->
      <section>
        <label class="block text-sm font-medium mb-1">Locations</label>

        <div class="flex gap-2 mb-2">
          <input id="city" placeholder="City"
            class="p-2 border rounded w-1/2" />
          <input id="country" placeholder="Country"
            class="p-2 border rounded w-1/2" />
          <button id="add-location-btn" type="button"
            class="px-3 py-2 bg-blue-600 text-white rounded">Add</button>
        </div>

        <div id="locationTags" class="flex flex-wrap gap-2"></div>
        <input type="hidden" name="locations" id="locationsInput" />
      </section>

      <!-- Salary Range -->
      <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Min Salary (optional)</label>
          <input type="number" name="salary_min"
            class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-200 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Max Salary (optional)</label>
          <input type="number" name="salary_max"
            class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-200 outline-none" />
        </div>
      </section>

      <!-- Experience -->
      <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Min Experience (years)</label>
          <input type="number" name="experience_min" required
            class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-200 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Max Experience (years)</label>
          <input type="number" name="experience_max" max="60" required
            class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-200 outline-none" />
        </div>
      </section>

      <!-- Actions -->
      <footer class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t">
        <button type="reset" class="px-4 py-2 rounded-lg border hover:bg-gray-100">Reset</button>
        <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Create Job</button>
      </footer>

    </form>
  </main>
{% endblock %}

{% block script %}
<script type="module" src="{% static 'js/create_job.js' %}"></script>
{% endblock %}
