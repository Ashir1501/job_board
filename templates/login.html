{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerZ: Login</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-100">

    <main class="w-full max-w-md">
        <section class="bg-white rounded-2xl shadow-lg p-8">
            <header class="mb-6">
                <h1 class="text-2xl font-semibold text-center">CareerZ</h1>
                <p class="text-1xl text-center">Provide your login credentials</p>
            </header>

            <form id="login-form" class="space-y-5" method="post">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div class="relative">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12" />

                    <button type="button" id="toggle-password-btn"
                        class="absolute right-3 top-9 text-sm text-gray-500 hover:text-gray-700">
                        Show
                    </button>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Log In
                </button>
            </form>

            <footer class="mt-6 text-center text-sm text-gray-500">
                <div>
                    <p class="font-bold">Not Registered? <a class="underline underline-offset-2 text-blue-500 font-bold"
                            href="{% url 'register' %}">Create an Account</a></p>
                </div>
                <p>&copy; 2026</p>
            </footer>
        </section>
    </main>
    <!-- Modal message -->               
    <div id="message" class="relative hidden">
        <div class="fixed top-[5%] left-[20%] p-6 border-2 rounded w-[60%] md:w-[60%]">
            <div id="messageContent" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
    <script type="module" src="{% static 'js/main.js' %}"></script>
</body>

</html>
