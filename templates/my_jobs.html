{% extends "./base.html" %}
{% load static %}

{% block title %}
<title>CareerZ: My Jobs</title>
{% endblock %}

{% block main %}
<!-- Main -->
<main class="flex-1 max-w-7xl mx-auto w-full px-6 py-6">

  <!-- Tabs -->
  <section class="mb-6">
    <div class="flex gap-4 border-b">
      <button id="tab-applied" class="py-2 px-4 border-b-2 border-blue-600 font-semibold">Applied Jobs</button>
      <button id="tab-bookmarked" class="py-2 px-4 text-gray-500">Bookmarked Jobs</button>
    </div>
  </section>

  <!-- Applied Jobs Section -->
  <section id="applied-section" class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <section id="appliedList" class="md:col-span-1 space-y-4 h-100 overflow-y-auto"></section>
  </section>

  <!-- Bookmarked Jobs Section -->
  <section id="bookmarked-section" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
    <section id="bookmarkedList" class="md:col-span-1 space-y-4 h-100 overflow-y-auto"></section>
  </section>

</main>
{% endblock %}

{% block script %}
<script type="module" src="{% static 'js/my_jobs.js' %}"></script>
{% endblock %}
