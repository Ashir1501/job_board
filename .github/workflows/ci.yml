name: Testing
on: push

jobs:
  test_project:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
    - name: Create .env file
      env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
      run: |
        echo "$ENV_FILE_CONTENT" > .env
    - name: Debug env loading
      run: |
        python -c "
        import environ
        environ.Env.read_env('.env')
        env = environ.Env()
        
        print('DB_NAME:', repr(env('DB_NAME', default='MISSING')))
        print('DB_USER:', repr(env('DB_USER', default='MISSING')))
        print('DATABASE_URL:', repr(env('DATABASE_URL', default='MISSING')))
        "
    - name: Debug Django database config
      run: |
        python manage.py shell -c "
        from django.conf import settings
        import pprint
        pprint.pprint(settings.DATABASES)
        "
    - name: Run DRF unit tests
      run: python manage.py test
